server:
  port: 3002
spring:
  application:
    name: email-service
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@rabbitmq:5672}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s
          max-attempts: 4
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/iot_platform}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  logs:
    token: ${EMAIL_LOG_TOKEN:}
  mq:
    exchange: ${EMAIL_EXCHANGE:iot-componentes.exchange}
    queue: email.outbox
    routing-key: ${EMAIL_ROUTING_KEY:email.outbox}
  mail:
    from: ${MAIL_FROM:no-reply@iot-componentes.local}

services:
  - type: web
    name: iot-componentes-1
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: iot-componentes-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PRINT_MONITOR_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: SUPERFRETE_TOKEN
        sync: false
      - key: SUPERFRETE_BASE_URL
        value: https://api.superfrete.com
      - key: SUPERFRETE_USER_AGENT
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: IoT Componentes

services:
  - type: web
    name: iot-componentes-1
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: iot-componentes-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PRINT_MONITOR_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: MELHOR_ENVIO_BASE_URL
        value: https://melhorenvio.com.br
      - key: MELHOR_ENVIO_USER_AGENT
        sync: false
